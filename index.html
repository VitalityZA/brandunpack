<style>
  html, body { margin: 0; height: 100%; background: var(--bu-cream); }
  #root { height: 100%; }
  @keyframes bu-marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes bu-panel-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes bu-reel { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  ::selection { background: var(--bu-orange-red); color: var(--bu-cream); }

  /* never allow horizontal scroll/overflow on small screens */
  html, body { overflow-x: hidden; max-width: 100%; }
  @media (max-width: 980px) {
    #site-scroll { overflow-x: hidden; }
    .bu-hero-grid > * { min-width: 0; }
  }

  /* ====================== RESPONSIVE: TABLET ≤1024px ====================== */
  @media (max-width: 1024px) {
    .bu-services-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .bu-amazon-grid { grid-template-columns: 1fr !important; }
    .bu-process-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .bu-why-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .bu-studio-grid { grid-template-columns: 300px 1fr !important; gap: 32px !important; }
    .bu-bento { grid-template-columns: repeat(2, 1fr) !important; }
  }

  /* ====================== NAV: hamburger ≤980px ====================== */
  @media (max-width: 980px) {
    .bu-nav-links { display: none !important; }
    .bu-nav-rate { display: none !important; }
    .bu-nav-cta { display: none !important; }
    .bu-nav-toggle { display: flex !important; }
    .bu-mobile-menu { display: block !important; }
    .bu-nav-inner { gap: 14px !important; }
    .bu-contact-grid { grid-template-columns: 1fr !important; gap: 36px !important; }
  }

  /* ====================== RESPONSIVE: PHONE ≤640px ====================== */
  @media (max-width: 640px) {
    .bu-hero-grid { grid-template-columns: 1fr !important; gap: 36px !important; padding-top: 40px !important; padding-bottom: 52px !important; }
    .bu-services-grid { grid-template-columns: 1fr !important; }
    .bu-process-grid { grid-template-columns: 1fr !important; }
    .bu-why-grid { grid-template-columns: 1fr !important; }
    .bu-stats-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 28px 16px !important; }
    .bu-studio-grid { grid-template-columns: 1fr !important; gap: 28px !important; }
    .bu-pricing-grid { grid-template-columns: 1fr !important; }
    .bu-voices-grid { grid-template-columns: 1fr !important; }
    .bu-voices-grid > div { grid-column: auto !important; }
    .bu-bento { grid-template-columns: 1fr !important; grid-auto-rows: 200px !important; }
    .bu-bento > .bu-tile { grid-column: span 1 !important; grid-row: span 1 !important; min-height: 200px !important; }
    .bu-detail-grid { grid-template-columns: 1fr !important; gap: 22px !important; }
    .bu-reel-card { width: 70vw !important; height: 380px !important; }
  }

  /* tighten section vertical padding on phones */
  @media (max-width: 640px) {
    section { padding-left: 0; padding-right: 0; }
  }
</style>
</head>
